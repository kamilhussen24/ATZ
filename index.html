<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ATZ COMMUNITY - টেলিগ্রামে জয়েন করুন</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Bengali Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',

    <noscript><img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=2036661763708169&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        :root {
            --bg-a: #0B1220;
            --bg-b: #0F1B33;
            --card: #FFFFFF;
            --ink: #0F172A;
            --muted: #64748B;
            --line: #E8EDF4;
            --soft: #F3F7FC;
            --tg-a: #229ED9;
            --tg-b: #2AABEE;
            --green: #16A34A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(70% 45% at 50% 0%, rgba(42, 171, 238, 0.28) 0%, transparent 70%),
                linear-gradient(180deg, var(--bg-b) 0%, var(--bg-a) 100%);
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px 40px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.5);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px);
            animation: rise 0.55s cubic-bezier(.2,.8,.2,1) 0.05s forwards;
        }
        @keyframes rise { to { opacity: 1; transform: none; } }

        /* ---------- Header ---------- */
        .head {
            padding: 30px 24px 22px;
            text-align: center;
        }

        .avatar {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--tg-a), var(--tg-b));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 10px 24px rgba(34, 158, 217, 0.35);
        }
        .avatar::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(42, 171, 238, 0.25);
        }

        .name {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1;
            color: var(--green);
        }
        .live .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            70% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
            100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }

        .tagline {
            margin: 12px auto 0;
            max-width: 300px;
            font-size: 0.95rem;
            color: var(--muted);
        }

        /* ---------- Stats ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin: 0 24px;
            background: var(--soft);
            border-radius: 14px;
            padding: 12px 0;
        }
        .stat { text-align: center; }
        .stat + .stat { border-left: 1px solid var(--line); }
        .stat b {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .stat span {
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* ---------- CTA ---------- */
        .cta { padding: 20px 24px 6px; }

        .join-btn {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--tg-a), var(--tg-b));
            color: #fff;
            font-size: 1.08rem;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            box-shadow: 0 10px 22px rgba(34, 158, 217, 0.35);
            -webkit-tap-highlight-color: transparent;
        }
        .join-btn i {
            font-size: 1.2rem;
            line-height: 1;
            display: flex;
        }
        .join-btn:hover { filter: brightness(1.05); }
        .join-btn:active { transform: scale(0.985); }
        .join-btn .shine {
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-20deg);
            animation: sweep 3s ease-in-out infinite;
        }
        @keyframes sweep {
            0% { left: -60%; }
            35%, 100% { left: 130%; }
        }

        .note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            line-height: 1;
            color: var(--muted);
        }
        .note i { font-size: 0.75rem; display: flex; }

        /* ---------- Features ---------- */
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 18px 24px 22px;
        }
        .feat {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.2;
        }
        .feat i {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: rgba(42, 171, 238, 0.1);
            color: var(--tg-a);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- Footer ---------- */
        .foot {
            border-top: 1px solid var(--line);
            padding: 12px 24px;
            text-align: center;
            font-size: 11px;
            color: #94A3B8;
        }
        .foot a { color: var(--tg-a); font-weight: 600; text-decoration: none; }

        @media (max-width: 360px) {
            .features { grid-template-columns: 1fr; }
            .name { font-size: 1.3rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .live .dot, .join-btn .shine { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

<main class="card">
    <header class="head">
        <div class="avatar"><i class="fas fa-users"></i></div>
        <h1 class="name">ATZ COMMUNITY</h1>
        <div class="live"><span class="dot"></span>এখন অ্যাক্টিভ</div>
        <p class="tagline">মার্কেট আপডেট, আলোচনা আর নতুন কিছু শেখা — সব এক জায়গায়।</p>
    </header>

    <section class="stats">
        <div class="stat"><b>১০,২০০+</b><span>সদস্য</span></div>
        <div class="stat"><b>২৪/৭</b><span>অ্যাক্টিভ</span></div>
        <div class="stat"><b>ফ্রি</b><span>জয়েন</span></div>
    </section>

    <section class="cta">
        <!-- Telegram invite link -->
        <a id="joinTelegramBtn" class="join-btn" href="https://t.me/+f8cGbVWyt8szMjQ1" target="_blank" rel="noopener">
            <span class="shine"></span>
            <i class="fab fa-telegram-plane"></i>
            <span>টেলিগ্রামে জয়েন করুন</span>
        </a>
        <div class="note"><i class="fas fa-lock"></i>এক ক্লিকেই Telegram-এ গ্রুপ খুলে যাবে</div>
    </section>

    <section class="features">
        <div class="feat"><i class="fas fa-chart-line"></i><span>মার্কেট আপডেট</span></div>
        <div class="feat"><i class="fas fa-comments"></i><span>ডেইলি ডিসকাশন</span></div>
        <div class="feat"><i class="fas fa-shield-halved"></i><span>প্রাইভেট গ্রুপ</span></div>
        <div class="feat"><i class="fas fa-clock"></i><span>২৪/৭ কমিউনিটি</span></div>
    </section>

    <footer class="foot">
        Ads By <a href="https://t.me/+mjeIPVeI4iAzYzNl" target="_blank" rel="noopener noreferrer">KDex</a>
    </footer>
</main>

<script>
// Toggle the Purchase event on/off
const TRACK_PURCHASE = true; // true = enabled, false = disabled

(function () {
    const btn = document.getElementById('joinTelegramBtn');
    if (!btn) return;

    // Fire the Purchase event on click; the link then opens Telegram in a new tab
    btn.addEventListener('click', function () {
        if (TRACK_PURCHASE && typeof fbq === 'function') {
            fbq('track', 'Purchase', {
                currency: 'BDT',
                value: 100
            });
        }
    });
})();
</script>
</body>
</html>
